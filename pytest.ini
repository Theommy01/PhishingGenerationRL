[pytest]
testpaths = tests
# tests/ has no __init__.py, so importmode=prepend puts the repo root on the
# path via tests/conftest.py — which is also what lets a test import a helper
# from tests.conftest.
addopts = -q
filterwarnings =
    # unsloth/transformers deprecation noise, imported transitively when
    # LoopRunner validates its generation arguments
    ignore::DeprecationWarning
